name: Feature Request
description: Propose a new capability or improvement for CitySaathi
labels: ["enhancement"]
body:
  - type: input
    id: feature
    attributes:
      label: Proposed Feature
      placeholder: e.g. Add WhatsApp chatbot integration for complaint filing
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Implementation Context
      description: Explain why this is needed and how it will work.
    validations:
      required: true
