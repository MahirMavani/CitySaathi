[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  AI_SERVICE_URL = "https://citysaathi-ai.vercel.app"
  AI_SERVICE_TIMEOUT_MS = "5000"

[functions]
  node_bundler = "esbuild"
  included_files = ["prisma/**", "data/**", "uploads/**"]
  timeout = 26

# Rewrite API routes to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Rewrite upload routes to the Netlify serverless function
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# SPA navigation fallback for browser routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
